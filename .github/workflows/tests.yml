name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Static checks (bash -n, shellcheck, safety-contract invariants)
        run: bash tests/test_static.sh

      - name: Unit tests (pure functions, no ZFS)
        run: bash tests/test_units.sh

      - name: Integration tests (full cycle, simulated ZFS)
        run: bash tests/test_integration.sh
