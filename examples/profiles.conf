# Perfiles operativos del ZFS Reblock Worker.
#
# Formato:  nombre = bw_target, bw_min, bw_max, cooldown_segundos, governor
#
# Este archivo documenta los perfiles que trae el worker. Son puntos de
# partida conservadores, NO benchmarks de su hardware: ajústelos a lo que
# realmente observe en su NAS durante las pruebas.
#
# governor:  off      = sin ajuste automático
#            auto     = puede subir y bajar el BW
#            guarded  = solo puede bajar, nunca subir por su cuenta

default      = 35M, 10M,  80M, 30, auto      # defaults heredados del V2
slow-hdd     = 20M,  8M,  40M, 45, guarded   # pools HDD sin SLOG, o vdev único
fast-storage = 80M, 20M, 160M, 10, auto      # NVMe / SSD, sin usuarios activos
night        = 35M, 10M,  80M, 30, auto      # ventana nocturna
conservative = 15M,  8M,  30M, 60, guarded   # NAS en producción con usuarios

# Uso:
#   ./zfs-reblock-worker.sh /mnt/pool/dataset --profile slow-hdd
#
# Un perfil solo fija valores de arranque: puede sobreescribir cualquiera de
# ellos con las opciones de CLI, o en caliente desde el menú [C].
